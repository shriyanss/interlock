# UA-2015: BLACKOUT lab. Only employee-workstation is published to the
# host — every other service must be reached the way the historical
# attack pivoted: enterprise -> VPN -> jump host -> control network.
#
# Network segmentation here is enforced by which service is attached to
# which network and by never publishing a `ports:` mapping on internal
# services — NOT by Compose's `internal: true` flag. That flag would also
# cut off containers from `host.docker.internal`, which every lab service
# needs to report events back to mission-controller (a process running on
# the host, not in this compose project). Documented simplification — see
# DEVELOPMENT.md.
#
# `host.docker.internal` only resolves out of the box on Docker Desktop —
# on native Linux Docker (e.g. this project's own deployment host) it
# doesn't exist unless added explicitly, which silently breaks every
# guided-mode event in the lab. Every service below that talks to
# mission-controller gets `extra_hosts: host.docker.internal:host-gateway`
# (Docker 20.10+) to make this portable across both.
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"
networks:
  internet:
  enterprise:
  ot_dmz:
  control:
  substations:

volumes:
  vpn-clients:
  wireguard-config:

services:
  employee-workstation:
    <<: *host-gateway
    build: ./enterprise/employee-workstation
    networks: [internet, enterprise]
    ports:
      - "8080:8080"
    volumes:
      - vpn-clients:/shared/vpn:ro
    environment:
      SESSION_ID: ${SESSION_ID:-}
      CONTROLLER_URL: http://host.docker.internal:4000

  domain-auth:
    image: osixia/openldap:1.5.0
    networks: [enterprise]
    environment:
      LDAP_ORGANISATION: Oblenergo Lab
      LDAP_DOMAIN: oblenergo.lab
      LDAP_ADMIN_PASSWORD: LabAdmin!2015
      # osixia defaults the cn=config admin password to the literal string
      # "config" rather than LDAP_ADMIN_PASSWORD (verified: LDAP_ADMIN_PASSWORD
      # alone gives "Invalid credentials" against cn=admin,cn=config) — set
      # explicitly so there's one secret to track, not a magic default to know.
      LDAP_CONFIG_PASSWORD: LabAdmin!2015

  # One-shot seed: osixia's own first-run bootstrap mechanism expects to
  # delete its internal bootstrap-ldif directory after use, which conflicts
  # with bind-mounting a seed file directly into it. Seeding via ldapadd
  # against the running server, after it's up, sidesteps that entirely.
  #
  # Also punches a narrow hole in the default userPassword ACL so a bind
  # authenticated as the phished employee account can read ops.admin's
  # password specifically — this is how a player is meant to discover the
  # jump-host SSH credential in-game, via LDAP enumeration, rather than
  # being told it. This is a FICTIONAL gameplay mechanic, not a documented
  # part of the 2015 incident (which harvested credentials via phishing,
  # keylogging, and network sniffing — see mission.yaml historical_fidelity).
  domain-auth-seed:
    image: osixia/openldap:1.5.0
    networks: [enterprise]
    depends_on: [domain-auth]
    entrypoint:
      - sh
      - -c
      - |
        until ldapwhoami -x -H ldap://domain-auth -D "cn=admin,dc=oblenergo,dc=lab" -w "LabAdmin!2015" >/dev/null 2>&1; do sleep 1; done
        ldapadd -x -H ldap://domain-auth -D "cn=admin,dc=oblenergo,dc=lab" -w "LabAdmin!2015" -f /seed/seed.ldif

        # cn=config's own admin password isn't necessarily ready the exact
        # moment the main database's bind succeeds (osixia applies them as
        # separate bootstrap steps) — retry rather than give up on the
        # first failed lookup.
        CONFIG_DN=""
        for i in $(seq 1 20); do
          CONFIG_DN=$(ldapsearch -x -H ldap://domain-auth -D "cn=admin,cn=config" -w "LabAdmin!2015" -b cn=config "(olcSuffix=dc=oblenergo,dc=lab)" dn -LLL 2>/dev/null | awk '/^dn:/{print $2; exit}')
          [ -n "$$CONFIG_DN" ] && break
          sleep 1
        done
        if [ -n "$$CONFIG_DN" ]; then
          printf 'dn: %s\nchangetype: modify\nreplace: olcAccess\nolcAccess: {0}to filter=(uid=ops.admin) attrs=userPassword by users read by * none\nolcAccess: {1}to attrs=userPassword by self write by anonymous auth by * none\nolcAccess: {2}to * by * read\n' "$$CONFIG_DN" | ldapmodify -x -H ldap://domain-auth -D "cn=admin,cn=config" -w "LabAdmin!2015"
        else
          echo "[domain-auth-seed] could not resolve config DN — ACL not applied, ops.admin's password will not be discoverable via LDAP"
        fi
    volumes:
      - ./enterprise/domain-auth/ldif-custom/seed.ldif:/seed/seed.ldif:ro
    restart: "no"

  # WireGuard instead of OpenVPN: kernel WireGuard creates its interface
  # via netlink rather than /dev/net/tun, so it works on hosts (like this
  # project's own dev/test host) that don't expose a TUN device to
  # containers. Falls back to a userspace implementation — which DOES need
  # /dev/net/tun — only if the host kernel lacks WireGuard support at all.
  # Published on the host: this is the lab's actual "internet-facing VPN
  # endpoint" a player connects their own WireGuard client to, mirroring
  # the historical externally-reachable VPN access.
  wireguard:
    <<: *host-gateway
    image: lscr.io/linuxserver/wireguard:latest
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks: [enterprise, ot_dmz]
    ports:
      - "51820:51820/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      SERVERPORT: "51820"
      PEERS: "1"
      SERVERURL: ${WIREGUARD_SERVERURL:-auto}
      # Whatever this is set to, ot/wireguard/custom-cont-init.d strips any
      # DNS line from the published peer config anyway — the image writes
      # "DNS = off" literally rather than omitting the line when this is
      # "off", which is itself invalid and would still break wg-quick.
      PEERDNS: "off"
      INTERNAL_SUBNET: 10.13.13.0
      SESSION_ID: ${SESSION_ID:-}
      CONTROLLER_URL: http://host.docker.internal:4000
    volumes:
      - wireguard-config:/config
      - vpn-clients:/shared/vpn
      - ./ot/wireguard/custom-cont-init.d:/custom-cont-init.d:ro

  jump-host:
    <<: *host-gateway
    image: lscr.io/linuxserver/openssh-server:latest
    networks: [ot_dmz, control]
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: ops.admin
      USER_PASSWORD: "ChangeMe!2015"
      PASSWORD_ACCESS: "true"
      SESSION_ID: ${SESSION_ID:-}
      CONTROLLER_URL: http://host.docker.internal:4000
    volumes:
      - ./ot/jump-host/custom-cont-init.d:/custom-cont-init.d:ro

  hmi:
    <<: *host-gateway
    build: ./hmi
    networks: [control]
    environment:
      SESSION_ID: ${SESSION_ID:-}
      CONTROLLER_URL: http://host.docker.internal:4000
      CONTROLLER_PUBLIC_URL: http://${ENTRYPOINT_HOST:-localhost}:4000

  defender:
    <<: *host-gateway
    build: ./defender
    networks: [enterprise, ot_dmz, control]
    environment:
      SESSION_ID: ${SESSION_ID:-}
      CONTROLLER_URL: http://host.docker.internal:4000
